name: Publish reviewed py-vchart release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reviewed GitHub release tag
        type: choice
        options: [py-visactor-vchart-v0.1.1]
        default: py-visactor-vchart-v0.1.1
      manifest_sha256:
        description: SHA256 of reviewed release-manifest.json
        type: string
        required: true
      publish:
        description: Publish after validation (requires configured PyPI publisher)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: py-vchart-publish-${{ inputs.release_tag }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        canvas: [0.1.0a18, 0.1.0a19]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Download and verify exact reviewed distributions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
        run: python tools/release_github.py download --tag "$RELEASE_TAG" --manifest-sha256 "$MANIFEST_SHA" --out test-runs/download
      - name: Install wheel and sdist outside checkout and render every chart type
        run: python tools/release_artifacts.py install --manifest test-runs/download/release-manifest.json --packages test-runs/download/packages --canvas '${{ matrix.canvas }}' --out test-runs/install
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-${{ matrix.os }}-${{ matrix.canvas }}
          path: test-runs/
          if-no-files-found: error
  publish:
    if: ${{ inputs.publish }}
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/py-visactor-vchart/0.1.1/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify upload bytes again
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
        run: python tools/release_github.py download --tag "$RELEASE_TAG" --manifest-sha256 "$MANIFEST_SHA" --out test-runs/download
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: test-runs/download/packages/
  verify:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Download reviewed identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
        run: python tools/release_github.py download --tag "$RELEASE_TAG" --manifest-sha256 "$MANIFEST_SHA" --out test-runs/download
      - name: Verify actual PyPI bytes and fresh external installations
        run: |
          python tools/release_artifacts.py pypi --manifest test-runs/download/release-manifest.json --out test-runs/pypi
          python tools/release_artifacts.py install --manifest test-runs/pypi/release-manifest.json --packages test-runs/pypi --out test-runs/installed-from-pypi
      - name: Promote verified stable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python tools/release_github.py promote --tag "$RELEASE_TAG" --out test-runs/promoted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pypi-verification
          path: test-runs/
          if-no-files-found: error
