[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "py-visactor-vchart"
version = "0.1.1"
description = "Native Python rendering of two-dimensional static VisActor VChart charts"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE", "LICENSE-VChart", "LICENSE-venn-js", "LICENSE-fmin", "LICENSE-statplot-palettes"]
keywords = ["visactor", "vchart", "charts", "visualization", "rendering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["py-skia-canvas>=0.1.0a18,<=0.1.0a19", "numpy>=1.26"]

[project.urls]
Repository = "https://github.com/py-VisActor/py-vchart"
Upstream = "https://github.com/VisActor/VChart"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[project.optional-dependencies]
render = []
reference = ["skia-python==144.1"]
test = ["Pillow>=10"]
